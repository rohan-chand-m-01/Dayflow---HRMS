[options]
; ── Database connection ──────────────────────────────────────────────────────
db_host = db
db_port = 5432
db_user = ${POSTGRES_USER}
db_password = ${POSTGRES_PASSWORD}
db_name = False

; ── Addons paths ─────────────────────────────────────────────────────────────
; /opt/odoo/addons  — Odoo built-in Community addons (from the container image)
; /mnt/extra-addons — Dayflow custom addons (mounted from ./addons/)
addons_path = /opt/odoo/addons,/mnt/extra-addons

; ── HTTP ─────────────────────────────────────────────────────────────────────
http_port = 8069
http_interface =

; ── Logging ──────────────────────────────────────────────────────────────────
logfile = False
log_level = info
log_handler = :INFO

; ── Security ─────────────────────────────────────────────────────────────────
admin_passwd = ${ODOO_MASTER_PASSWORD}

; ── Worker / performance (single-threaded for development) ───────────────────
workers = 0
max_cron_threads = 1

; ── Data directory ───────────────────────────────────────────────────────────
data_dir = /var/lib/odoo
